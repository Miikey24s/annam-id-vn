services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: annam-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CONTACT_EMAIL=annamnguyen204@gmail.com

networks:
  annam-network:
    driver: bridge

